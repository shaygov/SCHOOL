<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title></title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:24px}
    .header{display:flex;justify-content:space-between;align-items:center}
    .school{max-width:65%}
    h1,h2,h3{margin:6px 0}
    .school h1{font-size:16pt;margin:0}
    .meta{font-size:0.95rem;color:#333}
    .grading{margin-top:12px;padding:12px;border:1px solid #ddd;background:#fafafa}
    .variant{page-break-inside:avoid;border-top:1px solid #eee;padding-top:12px;margin-top:12px}
    .question{margin:10px 0;padding:10px;border-left:3px solid #0a66c2;background:#fff}
    .q-title{font-weight:700}
    .criteria{margin-top:6px}
    ul{margin:6px 0 12px 20px}
    .note{font-size:0.9rem;color:#555;border-top:1px dashed #ddd;padding-top:10px;margin-top:18px}
    pre{white-space:pre-wrap}
    @media print{body{margin:12mm}.no-print{display:none}}
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // Зареждане и рендиране на съдържанието от data.json (няма статично HTML)
    async function loadAndRender() {
      try {
        const res = await fetch('data.json');
        const data = await res.json();
        render(data);
      } catch (e) {
        const app = document.getElementById('app');
        app.textContent = 'Грешка при зареждане на data.json';
        console.error(e);
      }
    }

    function render(data) {
      const app = document.getElementById('app');
      app.innerHTML = '';

      const school = data.school || {};
      const test = data.test || {};
      const variant0 = (data.variants && data.variants[0]) || {};
      const rubric = data.rubric || {};

      document.title = `Критерии — ${test.subject || ''} ${test.class || ''}`.trim();

      // Toolbar
      const toolbar = el('div.toolbar');
      toolbar.style.marginBottom = '12px';
      const printBtn = el('button', text('Принтирай / Експортирай PDF'));
      printBtn.className = 'no-print';
      printBtn.onclick = () => window.print();
      toolbar.appendChild(printBtn);
      app.appendChild(toolbar);

      // Header
      const header = el('div.header');
      const schoolDiv = el('div.school');
      if (school.name) schoolDiv.appendChild(el('h1', text(school.name)));
      const metaParts = [];
      if (test.subject) metaParts.push(`Предмет: <strong>${test.subject}</strong>`);
      if (test.class) metaParts.push(`Клас: <strong>${test.class}</strong>`);
      if (test.term) metaParts.push(`${test.term}`);
      if (metaParts.length) schoolDiv.appendChild(el('div.meta', html(metaParts.join(' | '))));
      header.appendChild(schoolDiv);

      // Rubric metadata (version, author, scope)
      const metaRight = el('div.meta-right');
      metaRight.style.textAlign = 'right';

      // Място за подпис на Утвърдил
      const approveWrap = el('div');
      approveWrap.appendChild(el('div.meta', text('Утвърдил:')));

      const signatureLine = el('div');
      signatureLine.style.borderBottom = '1px solid #000';
      signatureLine.style.minWidth = '220px';
      signatureLine.style.display = 'inline-block';
      signatureLine.style.height = '1.2em';
      signatureLine.style.marginTop = '8px';
      approveWrap.appendChild(signatureLine);

      const signerName = el('div', text('Фанка Къшева'));
      signerName.style.marginTop = '6px';
      approveWrap.appendChild(signerName);

      metaRight.appendChild(approveWrap);
      header.appendChild(metaRight);

      app.appendChild(header);

      // Grading summary
      if ((test.points && (test.points.total || test.points.totalMultipleChoice || test.points.totalOpenEnded)) || (test.gradingScale && test.gradingScale.length)) {
        const grading = el('div.grading');
        const total = test.points && (test.points.total || test.points.totalMultipleChoice + (test.points.totalOpenEnded||0)) ? (test.points.total || (test.points.totalMultipleChoice + (test.points.totalOpenEnded||0))) : undefined;
        grading.appendChild(el('h2', text(rubric.gradingSummaryTitle || 'Обща точкова система и скала')));
        if (total !== undefined) grading.appendChild(el('p', html(`Точкова система: общо <strong>${total}</strong> т.`)));
        if (test.gradingScale && test.gradingScale.length) {
          grading.appendChild(el('p', text(rubric.gradingScaleLabel || 'Скала за оценки:')));
          const scaleUl = el('ul');
          test.gradingScale.forEach(s => scaleUl.appendChild(el('li', text(`от ${s.from} до ${s.to}: ${s.grade}`))));
          grading.appendChild(scaleUl);
        }
        app.appendChild(grading);
      }

      // Points breakdown
      const hasMC = variant0.multipleChoice && variant0.multipleChoice.length;
      const hasPoints = test.points && (test.points.multipleChoice != null || test.points.totalMultipleChoice != null || test.points.totalOpenEnded != null || test.points.total != null);
      if (hasMC || hasPoints) {
        app.appendChild(el('h2', text(rubric.pointsBreakdownTitle || 'Разпределение на точките по типове въпроси')));
        const pb = el('ul');
        const mcCount = (variant0.multipleChoice && variant0.multipleChoice.length) || 0;
        if (mcCount && test.points && test.points.multipleChoice != null) {
          const mcPer = test.points.multipleChoice;
          const totalMC = test.points.totalMultipleChoice != null ? test.points.totalMultipleChoice : (mcCount * mcPer);
          pb.appendChild(el('li', html(`Множествен избор — <strong>${mcCount} въпроса × ${mcPer} т. = ${totalMC} т.</strong>`)));
        }
        if (test.points && test.points.totalOpenEnded != null) {
          pb.appendChild(el('li', html(`Отворени — <strong>общо ${test.points.totalOpenEnded} т.</strong>`)));
        }
        if (test.points && test.points.total != null) {
          pb.appendChild(el('li', html(`Общо: <strong>${test.points.total} т.</strong>`)));
        }
        app.appendChild(pb);
      }

      // Criteria and general guidelines
      if ((rubric.criteria && (Array.isArray(rubric.criteria) ? rubric.criteria.length : true)) || (rubric.generalGuidelines && rubric.generalGuidelines.length)) {
        app.appendChild(el('h2', text(rubric.criteriaTitle || 'Критерии за оценяване')));
        const criteriaRoot = el('div');
        if (rubric.generalGuidelines && rubric.generalGuidelines.length) {
          const gList = el('ul');
          rubric.generalGuidelines.forEach(s => gList.appendChild(el('li', text(s))));
          criteriaRoot.appendChild(gList);
        } else if (rubric.criteria) {
          const cList = el('ul');
          if (Array.isArray(rubric.criteria)) {
            rubric.criteria.forEach(item => {
              if (typeof item === 'string') cList.appendChild(el('li', text(item)));
              else cList.appendChild(el('li', html((item.title ? `<strong>${item.title}</strong> ` : '') + (item.text || ''))));
            });
          }
          criteriaRoot.appendChild(cList);
        }
        app.appendChild(criteriaRoot);
      }

      // Rubric critical questions (checklist)
      if (rubric.criticalQuestions && rubric.criticalQuestions.length) {
        app.appendChild(el('h2', text(rubric.criticalQuestionsTitle || 'Ключови въпроси за оценяване')));
        const cq = el('ul');
        rubric.criticalQuestions.forEach(q => cq.appendChild(el('li', text(q))));
        app.appendChild(cq);
      }

      // Partial credit rules
      if (rubric.partialCreditRules && rubric.partialCreditRules.length) {
        app.appendChild(el('h2', text('Правила за частично точкуване')));
        rubric.partialCreditRules.forEach(rule => {
          app.appendChild(el('h3', text(rule.appliesTo || '')));
          if (rule.rules && rule.rules.length) {
            const rul = el('ul');
            rule.rules.forEach(r => rul.appendChild(el('li', text(r))));
            app.appendChild(rul);
          }
          if (rule.examples && rule.examples.length) {
            const ex = el('div');
            ex.appendChild(el('strong', text('Примери:')));
            const exul = el('ul');
            rule.examples.forEach(e => exul.appendChild(el('li', text(e))));
            app.appendChild(ex);
            app.appendChild(exul);
          }
        });
      }

      // Score matrix
      if (rubric.scoreMatrix && rubric.scoreMatrix.length) {
        app.appendChild(el('h2', text('Матрица за разпределение на точки')));
        const table = document.createElement('table');
        table.style.width = '100%';
        table.style.borderCollapse = 'collapse';
        table.style.marginBottom = '12px';
        const thead = document.createElement('thead');
        thead.innerHTML = '<tr><th style="border:1px solid #ddd;padding:6px;text-align:left">Въпрос</th><th style="border:1px solid #ddd;padding:6px">Точки</th><th style="border:1px solid #ddd;padding:6px">Разпределение</th></tr>';
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        rubric.scoreMatrix.forEach(row => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td style="border:1px solid #ddd;padding:6px">${row.question || ''}</td><td style="border:1px solid #ddd;padding:6px;text-align:center">${row.totalPoints != null ? row.totalPoints : ''}</td><td style="border:1px solid #ddd;padding:6px">${formatBreakdown(row.breakdown)}</td>`;
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        app.appendChild(table);
      }

      // Sample answers (flexible: supports string, object with fields, or nested structures)
      if (rubric.sampleAnswers && Object.keys(rubric.sampleAnswers).length) {
        app.appendChild(el('h2', text('Образци / Еталонни отговори')));
        Object.keys(rubric.sampleAnswers).forEach(k => {
          const item = rubric.sampleAnswers[k];
          app.appendChild(el('h3', text(`Въпрос ${k}`)));
          if (typeof item === 'string') {
            app.appendChild(el('p', text(item)));
            return;
          }
          if (item == null) return;
          // Common object shapes
          if (item.brief) app.appendChild(el('p', text(item.brief)));
          if (item.sampleAnswer && typeof item.sampleAnswer === 'string') app.appendChild(el('p', text(item.sampleAnswer)));
          if (item.scoringNotes) app.appendChild(el('p', text(`Бележки за оценяване: ${item.scoringNotes}`)));
          // If item is a plain object with other keys, render them cleanly
          const otherKeys = Object.keys(item).filter(x => !['brief','sampleAnswer','scoringNotes'].includes(x));
          otherKeys.forEach(key => {
            const val = item[key];
            if (typeof val === 'string') {
              app.appendChild(el('p', html(`<strong>${escapeHtml(key)}:</strong> ${escapeHtml(val)}`)));
            } else if (Array.isArray(val)) {
              const ul = el('ul');
              val.forEach(v => ul.appendChild(el('li', text(typeof v === 'string' ? v : JSON.stringify(v)))));
              app.appendChild(el('div', el('strong', text(`${key}:`))));
              app.appendChild(ul);
            } else {
              app.appendChild(el('pre', text(JSON.stringify(val, null, 2))));
            }
          });
        });
      }
      // Helper functions
      function formatBreakdown(b) {
        if (!b) return '';
        if (typeof b === 'object') {
          const labels = {
            definition: 'дефиниция',
            explanation: 'обяснение',
            examples: 'примери',
            concept: 'понятие',
            factors: 'фактори',
            clarity: 'яснота',
            diagramOrExample: 'диаграма/пример',
            presentation: 'представяне'
          };
          const esc = s => String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
          return Object.keys(b).map(k => `${labels[k] || k}: ${esc(b[k])}`).join('; ');
        }
        return String(b);
      }

      function el(tag, content) {
        const [t, cls] = tag.split('.');
        const node = document.createElement(t);
        if (cls) node.className = cls;
        if (content) {
          if (typeof content === 'string') node.textContent = content;
          else node.appendChild(content);
        }
        return node;
      }
      function text(s) { return document.createTextNode(s); }
      function html(s) { const span = document.createElement('span'); span.innerHTML = s; return span; }
      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }
    }

    window.addEventListener('load', loadAndRender);
  </script>
</body>
</html>

        return String(b);
      }

      function el(tag, content) {
        const [t, cls] = tag.split('.');
        const node = document.createElement(t);
        if (cls) node.className = cls;
        if (content) {
          if (typeof content === 'string') node.textContent = content;
          else node.appendChild(content);
        }
        return node;
      }
      function text(s) { return document.createTextNode(s); }
      function html(s) { const span = document.createElement('span'); span.innerHTML = s; return span; }
      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }
    }

    window.addEventListener('load', loadAndRender);
  </script>
</body>
</html>
<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title></title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:24px}
    .header{display:flex;justify-content:space-between;align-items:center}
    .school{max-width:65%}
    h1,h2,h3{margin:6px 0}
    .school h1{font-size:16pt;margin:0}
    .meta{font-size:0.95rem;color:#333}
    .grading{margin-top:12px;padding:12px;border:1px solid #ddd;background:#fafafa}
    .variant{page-break-inside:avoid;border-top:1px solid #eee;padding-top:12px;margin-top:12px}
    .question{margin:10px 0;padding:10px;border-left:3px solid #0a66c2;background:#fff}
    .q-title{font-weight:700}
    .criteria{margin-top:6px}
    ul{margin:6px 0 12px 20px}
    .note{font-size:0.9rem;color:#555;border-top:1px dashed #ddd;padding-top:10px;margin-top:18px}
    pre{white-space:pre-wrap}
    @media print{body{margin:12mm}.no-print{display:none}}
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // Зареждане и рендиране на съдържанието от data.json (няма статично HTML)
    async function loadAndRender() {
      try {
        const res = await fetch('data.json');
        const data = await res.json();
        render(data);
      } catch (e) {
        const app = document.getElementById('app');
        app.textContent = 'Грешка при зареждане на data.json';
        console.error(e);
      }
    }

    function render(data) {
      const app = document.getElementById('app');
      app.innerHTML = '';

      const school = data.school || {};
      const test = data.test || {};
      const variant0 = (data.variants && data.variants[0]) || {};
      const rubric = data.rubric || {};

      document.title = `Критерии — ${test.subject || ''} ${test.class || ''}`.trim();

      // Toolbar
      const toolbar = el('div.toolbar');
      toolbar.style.marginBottom = '12px';
      const printBtn = el('button', text('Принтирай / Експортирай PDF'));
      printBtn.className = 'no-print';
      printBtn.onclick = () => window.print();
      toolbar.appendChild(printBtn);
      app.appendChild(toolbar);

      // Header
      const header = el('div.header');
      const schoolDiv = el('div.school');
      if (school.name) schoolDiv.appendChild(el('h1', text(school.name)));
      const metaParts = [];
      if (test.subject) metaParts.push(`Предмет: <strong>${test.subject}</strong>`);
      if (test.class) metaParts.push(`Клас: <strong>${test.class}</strong>`);
      if (test.term) metaParts.push(`${test.term}`);
      if (metaParts.length) schoolDiv.appendChild(el('div.meta', html(metaParts.join(' | '))));
      header.appendChild(schoolDiv);

      // Rubric metadata (version, author, scope)
      const metaRight = el('div.meta-right');
      metaRight.style.textAlign = 'right';

      // Място за подпис на Утвърдил
      const approveWrap = el('div');
      approveWrap.appendChild(el('div.meta', text('Утвърдил:')));

      const signatureLine = el('div');
      signatureLine.style.borderBottom = '1px solid #000';
      signatureLine.style.minWidth = '220px';
      signatureLine.style.display = 'inline-block';
      signatureLine.style.height = '1.2em';
      signatureLine.style.marginTop = '8px';
      approveWrap.appendChild(signatureLine);

      const signerName = el('div', text('Фанка Къшева'));
      signerName.style.marginTop = '6px';
      approveWrap.appendChild(signerName);

      metaRight.appendChild(approveWrap);
      header.appendChild(metaRight);

      app.appendChild(header);

      // Grading summary
      if ((test.points && (test.points.total || test.points.totalMultipleChoice || test.points.totalOpenEnded)) || (test.gradingScale && test.gradingScale.length)) {
        const grading = el('div.grading');
        const total = test.points && (test.points.total || test.points.totalMultipleChoice + (test.points.totalOpenEnded||0)) ? (test.points.total || (test.points.totalMultipleChoice + (test.points.totalOpenEnded||0))) : undefined;
        grading.appendChild(el('h2', text(rubric.gradingSummaryTitle || 'Обща точкова система и скала')));
        if (total !== undefined) grading.appendChild(el('p', html(`Точкова система: общо <strong>${total}</strong> т.`)));
        if (test.gradingScale && test.gradingScale.length) {
          grading.appendChild(el('p', text(rubric.gradingScaleLabel || 'Скала за оценки:')));
          const scaleUl = el('ul');
          test.gradingScale.forEach(s => scaleUl.appendChild(el('li', text(`от ${s.from} до ${s.to}: ${s.grade}`))));
          grading.appendChild(scaleUl);
        }
        app.appendChild(grading);
      }

      // Points breakdown
      const hasMC = variant0.multipleChoice && variant0.multipleChoice.length;
      const hasPoints = test.points && (test.points.multipleChoice != null || test.points.totalMultipleChoice != null || test.points.totalOpenEnded != null || test.points.total != null);
      if (hasMC || hasPoints) {
        app.appendChild(el('h2', text(rubric.pointsBreakdownTitle || 'Разпределение на точките по типове въпроси')));
        const pb = el('ul');
        const mcCount = (variant0.multipleChoice && variant0.multipleChoice.length) || 0;
        if (mcCount && test.points && test.points.multipleChoice != null) {
          const mcPer = test.points.multipleChoice;
          const totalMC = test.points.totalMultipleChoice != null ? test.points.totalMultipleChoice : (mcCount * mcPer);
          pb.appendChild(el('li', html(`Множествен избор — <strong>${mcCount} въпроса × ${mcPer} т. = ${totalMC} т.</strong>`)));
        }
        if (test.points && test.points.totalOpenEnded != null) {
          pb.appendChild(el('li', html(`Отворени — <strong>общо ${test.points.totalOpenEnded} т.</strong>`)));
        }
        if (test.points && test.points.total != null) {
          pb.appendChild(el('li', html(`Общо: <strong>${test.points.total} т.</strong>`)));
        }
        app.appendChild(pb);
      }

      // Criteria and general guidelines
      if ((rubric.criteria && (Array.isArray(rubric.criteria) ? rubric.criteria.length : true)) || (rubric.generalGuidelines && rubric.generalGuidelines.length)) {
        app.appendChild(el('h2', text(rubric.criteriaTitle || 'Критерии за оценяване')));
        const criteriaRoot = el('div');
        if (rubric.generalGuidelines && rubric.generalGuidelines.length) {
          const gList = el('ul');
          rubric.generalGuidelines.forEach(s => gList.appendChild(el('li', text(s))));
          criteriaRoot.appendChild(gList);
        } else if (rubric.criteria) {
          const cList = el('ul');
          if (Array.isArray(rubric.criteria)) {
            rubric.criteria.forEach(item => {
              if (typeof item === 'string') cList.appendChild(el('li', text(item)));
              else cList.appendChild(el('li', html((item.title ? `<strong>${item.title}</strong> ` : '') + (item.text || ''))));
            });
          }
          criteriaRoot.appendChild(cList);
        }
        app.appendChild(criteriaRoot);
      }

      // Rubric critical questions (checklist)
      if (rubric.criticalQuestions && rubric.criticalQuestions.length) {
        app.appendChild(el('h2', text(rubric.criticalQuestionsTitle || 'Ключови въпроси за оценяване')));
        const cq = el('ul');
        rubric.criticalQuestions.forEach(q => cq.appendChild(el('li', text(q))));
        app.appendChild(cq);
      }

      // Partial credit rules
      if (rubric.partialCreditRules && rubric.partialCreditRules.length) {
        app.appendChild(el('h2', text('Правила за частично точкуване')));
        rubric.partialCreditRules.forEach(rule => {
          app.appendChild(el('h3', text(rule.appliesTo || '')));
          if (rule.rules && rule.rules.length) {
            const rul = el('ul');
            rule.rules.forEach(r => rul.appendChild(el('li', text(r))));
            app.appendChild(rul);
          }
          if (rule.examples && rule.examples.length) {
            const ex = el('div');
            ex.appendChild(el('strong', text('Примери:')));
            const exul = el('ul');
            rule.examples.forEach(e => exul.appendChild(el('li', text(e))));
            app.appendChild(ex);
            app.appendChild(exul);
          }
        });
      }

      // Score matrix
      if (rubric.scoreMatrix && rubric.scoreMatrix.length) {
        app.appendChild(el('h2', text('Матрица за разпределение на точки')));
        const table = document.createElement('table');
        table.style.width = '100%';
        table.style.borderCollapse = 'collapse';
        table.style.marginBottom = '12px';
        const thead = document.createElement('thead');
        thead.innerHTML = '<tr><th style="border:1px solid #ddd;padding:6px;text-align:left">Въпрос</th><th style="border:1px solid #ddd;padding:6px">Точки</th><th style="border:1px solid #ddd;padding:6px">Разпределение</th></tr>';
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        rubric.scoreMatrix.forEach(row => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td style="border:1px solid #ddd;padding:6px">${row.question || ''}</td><td style="border:1px solid #ddd;padding:6px;text-align:center">${row.totalPoints != null ? row.totalPoints : ''}</td><td style="border:1px solid #ddd;padding:6px">${formatBreakdown(row.breakdown)}</td>`;
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        app.appendChild(table);
      }

      // Sample answers
      if (rubric.sampleAnswers && Object.keys(rubric.sampleAnswers).length) {
        app.appendChild(el('h2', text('Образци / Еталонни отговори')));
        Object.keys(rubric.sampleAnswers).forEach(k => {
          const item = rubric.sampleAnswers[k];
          app.appendChild(el('h3', text(`Въпрос ${k}`)));
          if (item.brief) app.appendChild(el('p', text(item.brief)));
          if (item.scoringNotes) app.appendChild(el('p', text(`Бележки за оценяване: ${item.scoringNotes}`)));
        });
      }
      // Helper functions
      function formatBreakdown(b) {
        if (!b) return '';
        if (typeof b === 'object') {
          return Object.keys(b).map(k => `${k}: ${b[k]}`).join('; ');
        }
        return String(b);
      }

      function el(tag, content) {
        const [t, cls] = tag.split('.');
        const node = document.createElement(t);
        if (cls) node.className = cls;
        if (content) {
          if (typeof content === 'string') node.textContent = content;
          else node.appendChild(content);
        }
        return node;
      }
      function text(s) { return document.createTextNode(s); }
      function html(s) { const span = document.createElement('span'); span.innerHTML = s; return span; }
    }

    window.addEventListener('load', loadAndRender);
  </script>
</body>
</html>
