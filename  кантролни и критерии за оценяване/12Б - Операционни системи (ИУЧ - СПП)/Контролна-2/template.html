<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контролна работа - <span id="subject-placeholder"></span> <span id="class-placeholder"></span> - Вариант <span id="variant-placeholder"></span></title>
    <style>
        .page-header-injected {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            font-size: 10pt;
            line-height: 1.2;
            padding: 3px 0;
            border-bottom: 1px solid #000;
            background: white;
            min-height: 55px;
            box-sizing: border-box;
            margin-bottom: 5px;
            page-break-inside: avoid;
        }
        .page-break-wrapper {
            page-break-before: always;
            page-break-inside: avoid;
            break-inside: avoid;
        }
        .page-break-wrapper .page-header-injected {
            margin-bottom: 5px;
            page-break-after: avoid;
            break-after: avoid;
        }
        /* Гарантираме, че header-ът и първия елемент след него остават заедно */
        .page-break-wrapper > *:first-child + * {
            page-break-before: avoid;
            break-before: avoid;
        }
        .page-header-injected .ministry {
            font-weight: bold;
            font-size: 10pt;
            margin-bottom: 0px;
        }
        .page-header-injected .school {
            font-weight: bold;
            font-size: 10pt;
            margin-bottom: 0px;
        }
        .page-header-injected .contact {
            font-size: 9pt;
            margin-top: 0px;
        }
        .page-header-injected .header-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .page-header-injected .header-content {
            flex: 1;
            text-align: center;
        }
        /* Header-ът не трябва да създава празна страница */
        .page-header-injected.page-break-before {
            page-break-before: auto;
        }
        /* Consolidated print styles */
      
        /* page-header-print removed */
        body {
            font-family: 'Times New Roman', serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 5px;
            max-width: 21cm;
            margin: 0 auto;
        }
        /* print rules consolidated above */
        .header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            font-size: 18pt;
        }
        .header p {
            margin: 5px 0;
            font-size: 12pt;
        }
        .header-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .header-date {
            text-align: left;
        }
        .header-approval {
            text-align: right;
            font-size: 11pt;
            min-width: 250px;
        }
        .header-approval .approval-line {
            margin: 2px 0;
        }
        .header-approval .approval-name {
            margin-left: 20px;
            margin-top: 5px;
        }
        .header-approval .approval-title {
            margin-left: 20px;
            font-style: italic;
        }
        .student-info {
            margin: 10px 0;
            padding: 8px;
            border: 1px solid #000;
        }
        .student-info table {
            width: 100%;
            border-collapse: collapse;
        }
        .student-info td {
            padding: 5px;
            border: 1px solid #000;
        }
        h2 {
            font-size: 14pt;
            margin-top: 25px;
            margin-bottom: 15px;
            border-bottom: 1px solid #000;
            padding-bottom: 5px;
        }
        .question {
            margin: 0px 0px 16px;
            padding: 0px;
            page-break-inside: avoid;
            break-inside: avoid;
            orphans: 3;
            widows: 3;
        }
        .question-number {
            position: relative;
            font-weight: bold;
            margin-bottom: 0;
            padding-right: 80px;
        }
        .question-text {
            margin-bottom: 10px;
        }
        .options {
            margin-left: 20px;
            page-break-inside: avoid;
            break-inside: avoid;
        }
        .option {
            margin: 6px 0;
        }
        .open-question {
            margin: 25px 0;
            padding: 15px;
            border: 1px solid #ccc;
            page-break-inside: avoid;
            break-inside: avoid;
        }
        .answer-space {
            height: 270px;
            border: 1px solid #000;
            margin-top: 10px;
            padding: 15px 10px;
            background-color: #fff;
            line-height: 26px;
            /* Use fixed background-size so line spacing is equal on screen and paper */
            background-image: linear-gradient(to bottom, transparent calc(100% - 1px), #444 1px);
            background-size: 100% 26px;
            background-repeat: repeat-y;
            position: relative;
            overflow: auto;
         }
        .code-block {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 10pt;
        }
        .points {
            float: right;
            font-weight: bold;
        }
        .points-display {
            position: absolute;
            right: 0;
            top: 0px;
            text-align: right;
            margin-bottom: 0;
            font-weight: bold;
        }
        .total-points {
            text-align: right;
            margin-top: 30px;
            font-size: 12pt;
            font-weight: bold;
        }
        .page-break-after {
            page-break-after: always;
            break-after: page;
        }
        .page-break-before {
            page-break-before: always;
            break-before: page;
        }
        .grading-scale {
            margin-top: 40px;
            page-break-inside: avoid;
            page-break-before: always;
        }
        .grading-scale table {
            width: 50%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        .grading-scale th {
            color: #000;
            padding: 10px;
            text-align: center;
            border: 1px solid #000;
        }
        .grading-scale td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        .grading-fields {
            margin-top: 30px;
            font-size: 12pt;
        }
        .grading-fields .field {
            margin: 15px 0;
            display: flex;
            align-items: baseline;
        }
        .grading-fields .field-label {
            min-width: 120px;
            font-weight: bold;
        }
        .grading-fields .field-line {
            flex: 1;
            border-bottom: 1px dotted #000;
            margin-left: 10px;
            min-height: 20px;
        }




        @media print {
            /* Page setup */
            @page {
                size: A4;
                margin: 1.2cm 1.5cm;
            }
            html, body {
                background: white;
                padding-top: 0;
                margin-top: 0;
                height: auto;
            }

            /* Printed answer lines: ensure exact spacing and visible lines when printing.
               Use background-size to guarantee equal line height; make area expand on paper. */
            .answer-space {
                background-color: #fff !important;
                line-height: 26px !important;
                background-image: linear-gradient(to bottom, transparent calc(100% - 1px), #000 1px) !important;
                background-size: 100% 26px !important;
                background-repeat: repeat-y !important;
                background-position: 0 0 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                /* Expand answer area on paper to avoid clipping lines */
                max-height: none !important;
                overflow: visible !important;
            }
        }
    </style>
</head>
<body>
    <!-- page-header-print removed -->
    <div class="container" id="container">
        <!-- Съдържанието ще се генерира динамично -->
    </div>
    <script>
        // Конфигурация - задайте варианта и пътя към JSON файла
        // Вариантът може да се зададе чрез URL параметър: ?variant=1 или ?variant=2
        const urlParams = new URLSearchParams(window.location.search);
        const CONFIG = {
            variant: parseInt(urlParams.get('variant')) || 1, // По подразбиране вариант 1
            dataFile: urlParams.get('data') || 'data.json' // Път към JSON файла
        };

        let testData = null;

        // Зареждане на данните от JSON
        async function loadData() {
            try {
                const response = await fetch(CONFIG.dataFile);
                testData = await response.json();
                generateTest();
            } catch (error) {
                console.error('Грешка при зареждане на данните:', error);
                document.getElementById('container').innerHTML = '<p style="color: red;">Грешка при зареждане на данните. Моля, проверете дали файлът data.json съществува.</p>';
            }
        }

        // Създаване на header HTML шаблон
        function createHeader() {
            const headerDiv = document.createElement('div');
            headerDiv.className = 'page-header-injected';
            const logo = testData.school.logo || 'logo.png';
            headerDiv.innerHTML = `
                <img src="${logo}" alt="Logo" class="header-logo" onerror="this.style.display='none'">
                <div class="header-content">
                    <div class="ministry">${testData.school.ministry}</div>
                    <div class="school">${testData.school.name}</div>
                    <div class="contact">${testData.school.contact}</div>
                </div>
                <img src="${logo}" alt="Logo" class="header-logo" onerror="this.style.display='none'">
            `;
            return headerDiv;
        }

        // Генериране на теста
        function generateTest() {
            const container = document.getElementById('container');
            const variant = testData.variants[CONFIG.variant - 1];
            const test = testData.test;

            // Обновяване на заглавието
            document.title = `Контролна работа - ${test.subject} ${test.class} - Вариант ${CONFIG.variant}`;

            // Header info populated in createHeader()

            // Генериране на header секцията
            let html = `
                <div class="header">
                    <h1>КОНТРОЛНА РАБОТА ПО ${test.subject.toUpperCase()}</h1>
                    <p><strong>Клас:</strong> ${test.class} | <strong>Вариант ${CONFIG.variant}</strong></p>
                    <div class="header-bottom">
                        <div class="header-date">
                            <p><strong>${test.term}</strong></p>
                        </div>
                        <div class="header-approval">
                            <div class="approval-line"><strong>${test.approval.approvedBy}</strong>...................................</div>
                            <div class="approval-name">${test.approval.name}</div>
                            <div class="approval-title">${test.approval.title}</div>
                        </div>
                    </div>
                </div>

                <div class="student-info">
                    <table>
                        <tr>
                            <td style="width: 33.33%;"><strong>Име:</strong><br/><br/></td>
                            <td style="width: 33.33%;"><strong>Фамилия:</strong><br/><br/></td>
                            <td style="width: 33.33%;"><strong>Номер в клас:</strong><br/><br/></td>
                        </tr>
                    </table>
                </div>
            `;

            // Генериране на тестовите въпроси
            variant.multipleChoice.forEach((q, index) => {
                html += `
                    <div class="question">
                        <div class="question-number">${q.number}. ${q.question} <div class="points-display">(${test.points.multipleChoice} точки)</div></div>
                        
                        <div class="options">
                `;
                const labels = ['а', 'б', 'в', 'г'];
                q.options.forEach((option, optIndex) => {
                    html += `<div class="option">${labels[optIndex]}) ${option}</div>`;
                });
                html += `
                        </div>
                    </div>
                `;
            });

            // Генериране на отворените въпроси
            variant.openEnded.forEach((q) => {
                html += `
                    <div class="open-question">
                        <div class="question-number">${q.number}. ${q.question} <div class="points-display">(${test.points.openEnded} точки)</div></div>
                `;
                if (q.requirements && q.requirements.length > 0) {
                    html += '<ul>';
                    q.requirements.forEach(req => {
                        html += `<li>${req}</li>`;
                    });
                    html += '</ul>';
                }
                html += `
                        <div class="answer-space"></div>
                    </div>
                `;
            });

            // Генериране на скалата за оценяване
            html += `
                <div class="grading-scale">
                    <table>
                        <thead>
                            <tr>
                                <th colspan="2">Скала за превръщане на точките в оценка:</th>
                            </tr>
                            <tr>
                                <th>точки</th>
                                <th>оценка</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            test.gradingScale.forEach(scale => {
                html += `
                    <tr>
                        <td>от ${scale.from} до ${scale.to}т.</td>
                        <td>${scale.grade}</td>
                    </tr>
                `;
            });
            html += `
                        </tbody>
                    </table>
                </div>

                <div class="grading-fields">
                    <div class="field">
                        <span class="field-label">Общо точки:</span>
                        <span class="field-line"></span>
                    </div>
                    <div class="field">
                        <span class="field-label">Оценка:</span>
                        <span class="field-line"></span>
                    </div>
                    <div class="field">
                        <span class="field-label">Преподавател:</span>
                        <span class="field-line"></span>
                    </div>
                    <div class="field">
                        <span class="field-label">Ученик:</span>
                        <span class="field-line"></span>
                    </div>
                </div>
            `;

            container.innerHTML = html;

            // Добавяме само един header в началото (само на първата страница)
            if (container.firstChild) {
                const headerDiv = createHeader();
                container.insertBefore(headerDiv, container.firstChild);
            }
        }

        // Изпълняваме при зареждане на страницата
        window.addEventListener('load', loadData);
    </script>
</body>
</html>
