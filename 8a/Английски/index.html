<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Горещия стол — Hot Seat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --fire-1: #ff4d00;
      --fire-2: #ff8c00;
      --fire-3: #ffd000;
      --dark: #0d0a0a;
      --dark-2: #1a1210;
      --card: rgba(30, 18, 14, 0.85);
      --glow: rgba(255, 100, 0, 0.5);
      --text: #fff5ee;
      --muted: rgba(255, 245, 238, 0.55);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      background: var(--dark);
      color: var(--text);
    }

    body {
      display: block;
    }

    /* Fixed 16:9 canvas — scales uniformly on any screen */
    .stage {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .app {
      --design-w: 1600;
      --design-h: 900;
      width: calc(var(--design-w) * 1px);
      height: calc(var(--design-h) * 1px);
      flex-shrink: 0;
      transform: scale(min(calc(100vw / var(--design-w)), calc(100dvh / var(--design-h))));
      transform-origin: center center;
      display: flex;
      flex-direction: column;
      padding: 28px 48px;
      gap: 16px;
      overflow: hidden;
    }

    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 0 0 88px;
      height: 88px;
    }

    /* Animated background */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(255, 60, 0, 0.35) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 20% 80%, rgba(255, 140, 0, 0.2) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(255, 200, 0, 0.15) 0%, transparent 50%),
        linear-gradient(180deg, #0a0606 0%, #1a0e0a 50%, #2a1208 100%);
    }

    .embers {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .ember {
      position: absolute;
      bottom: -10px;
      width: 4px;
      height: 4px;
      background: var(--fire-2);
      border-radius: 50%;
      opacity: 0;
      animation: rise linear infinite;
      box-shadow: 0 0 6px var(--fire-1);
    }

    @keyframes rise {
      0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
      10%  { opacity: 0.9; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-110vh) translateX(var(--drift)) scale(0.2); opacity: 0; }
    }

    .heat-wave {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 30vh;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(0deg, rgba(255, 80, 0, 0.12) 0%, transparent 100%);
      animation: wave 4s ease-in-out infinite;
    }

    @keyframes wave {
      0%, 100% { opacity: 0.6; transform: scaleY(1); }
      50%      { opacity: 1; transform: scaleY(1.08); }
    }

    /* Layout — fixed proportions inside 1600×900 canvas */

    /* Header */
    .header {
      text-align: center;
      animation: fadeDown 0.8s ease-out;
    }

    .header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 80px;
      letter-spacing: 0.06em;
      line-height: 1;
      background: linear-gradient(135deg, var(--fire-3) 0%, var(--fire-1) 50%, var(--fire-2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px var(--glow));
      animation: titlePulse 3s ease-in-out infinite;
    }

    .header .subtitle {
      font-size: 20px;
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    @keyframes titlePulse {
      0%, 100% { filter: drop-shadow(0 0 20px var(--glow)); }
      50%      { filter: drop-shadow(0 0 45px rgba(255, 120, 0, 0.8)); }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Chair — large, centered in the hot seat */
    .chair-wrap {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
      flex: 0 0 auto;
      animation: fadeUp 0.8s ease-out 0.2s both;
      line-height: 1;
      min-height: calc(150px * var(--s));
      padding-bottom: 12px;
      margin-bottom: 8px;
    }

    .chair {
      font-size: calc(160px * var(--s));
      line-height: 1;
      display: block;
      filter: drop-shadow(0 0 35px rgba(255, 80, 0, 0.7));
      animation: chairHeat 2s ease-in-out infinite;
      user-select: none;
    }

    @keyframes chairHeat {
      0%, 100% { transform: scale(1) rotate(-2deg); filter: drop-shadow(0 0 20px rgba(255, 80, 0, 0.5)); }
      50%      { transform: scale(1.03) rotate(2deg); filter: drop-shadow(0 0 40px rgba(255, 120, 0, 0.9)); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Word card — fills all available space (the hot seat) */
    .word-stage {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: stretch;
      justify-content: center;
      animation: fadeUp 0.8s ease-out 0.4s both;
    }

    .word-card {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 40px;
      background: var(--card);
      border: 2px solid rgba(255, 100, 0, 0.3);
      border-radius: 24px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow:
        0 0 60px rgba(255, 60, 0, 0.15),
        inset 0 1px 0 rgba(255, 200, 100, 0.1);
      transition: border-color 0.3s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
    }

    .seat-center {
      --s: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      width: 100%;
      max-width: 100%;
      flex: 1 1 auto;
      min-height: 0;
    }

    .word-card-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 100%;
      flex-shrink: 0;
      margin-top: 24px;
    }

    .word-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 100, 0, 0.05) 0%, transparent 50%);
      pointer-events: none;
    }

    .word-card.shuffling {
      border-color: rgba(255, 200, 0, 0.6);
      box-shadow: 0 0 80px rgba(255, 120, 0, 0.35);
      animation: cardShake 0.15s ease-in-out infinite;
    }

    .word-card.revealed {
      border-color: rgba(255, 200, 0, 0.5);
      animation: revealPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes cardShake {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-3px); }
      75%      { transform: translateX(3px); }
    }

    @keyframes revealPop {
      0%   { transform: scale(0.95); opacity: 0.7; }
      60%  { transform: scale(1.02); }
      100% { transform: scale(1); opacity: 1; }
    }

    .word-label {
      font-size: calc(22px * var(--s));
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 0;
      margin-top: 0;
      flex-shrink: 0;
    }

    .word-display {
      font-family: 'Bebas Neue', sans-serif;
      font-size: calc(100px * var(--s));
      letter-spacing: 0.04em;
      line-height: 1.05;
      color: var(--text);
      max-width: 100%;
      word-wrap: break-word;
      overflow-wrap: break-word;
      hyphens: auto;
      transition: opacity 0.05s;
      flex-shrink: 0;
    }

    .word-display.shuffling {
      color: var(--fire-2);
      animation: wordFlash 0.08s ease-in-out infinite alternate;
    }

    .word-display.revealed {
      background: linear-gradient(135deg, #fff 0%, var(--fire-3) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: wordGlow 2s ease-in-out infinite;
    }

    @keyframes wordFlash {
      from { opacity: 0.6; }
      to   { opacity: 1; }
    }

    @keyframes wordGlow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 200, 0, 0.3)); }
      50%      { filter: drop-shadow(0 0 25px rgba(255, 200, 0, 0.6)); }
    }

    .word-translation {
      font-size: calc(44px * var(--s));
      color: rgba(255, 200, 100, 0.85);
      letter-spacing: 0.03em;
      max-width: 100%;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.5s 0.15s, transform 0.5s 0.15s;
      flex-shrink: 0;
    }

    .word-translation.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .word-translation.shuffling {
      opacity: 0.4;
      color: var(--fire-2);
      transition: none;
    }

    .word-hint {
      margin-top: 0;
      font-size: calc(30px * var(--s));
      color: rgba(255, 245, 238, 0.85);
      font-style: italic;
      max-width: 1200px;
      line-height: 1.35;
      flex-shrink: 0;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s 0.3s, transform 0.5s 0.3s;
      flex-shrink: 0;
    }

    .word-hint.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Bottom panel — always visible */
    .bottom-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex: 0 0 168px;
      height: 168px;
      width: 100%;
    }

    /* Counter */
    .stats {
      display: flex;
      gap: 48px;
      font-size: 22px;
      color: var(--muted);
      animation: fadeUp 0.8s ease-out 0.5s both;
    }

    .stats span {
      color: var(--fire-3);
      font-weight: 700;
    }

    /* Buttons */
    .controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeUp 0.8s ease-out 0.6s both;
      flex-shrink: 0;
    }

    .btn {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 700;
      padding: 16px 40px;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      position: relative;
      overflow: hidden;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn:not(:disabled):hover {
      transform: translateY(-3px) scale(1.03);
    }

    .btn:not(:disabled):active {
      transform: translateY(0) scale(0.98);
    }

    .btn-start {
      background: linear-gradient(135deg, var(--fire-1) 0%, var(--fire-2) 100%);
      color: white;
      box-shadow: 0 6px 30px rgba(255, 80, 0, 0.45);
      min-width: 240px;
    }

    .btn-start:not(:disabled):hover {
      box-shadow: 0 10px 40px rgba(255, 80, 0, 0.6);
    }

    .btn-next {
      background: transparent;
      color: var(--fire-3);
      border: 2px solid rgba(255, 200, 0, 0.4);
      box-shadow: 0 0 20px rgba(255, 200, 0, 0.1);
    }

    .btn-next:not(:disabled):hover {
      background: rgba(255, 200, 0, 0.08);
      box-shadow: 0 0 30px rgba(255, 200, 0, 0.2);
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: translateX(-100%);
    }

    .btn:not(:disabled):hover::after {
      animation: shimmer 0.6s ease;
    }

    @keyframes shimmer {
      to { transform: translateX(100%); }
    }

    /* Instructions */
    .instructions {
      max-width: 1200px;
      text-align: center;
      font-size: 18px;
      color: var(--muted);
      line-height: 1.35;
      animation: fadeUp 0.8s ease-out 0.7s both;
    }

    .instructions strong {
      color: var(--fire-3);
    }

    /* Confetti burst on reveal */
    .burst {
      position: fixed;
      pointer-events: none;
      z-index: 10;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: burst 0.8s ease-out forwards;
    }

    @keyframes burst {
      0%   { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--bx), var(--by)) scale(0); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="embers" id="embers"></div>
  <div class="heat-wave"></div>

  <div class="stage">
  <div class="app">
    <div class="top-section">
      <header class="header">
        <h1>🔥 Горещия стол</h1>
        <p class="subtitle">Hot Seat — Classroom Edition</p>
      </header>
    </div>

    <div class="word-stage">
      <div class="word-card" id="wordCard">
        <div class="seat-center">
          <div class="chair-wrap">
            <div class="chair" aria-hidden="true">🪑</div>
          </div>
          <div class="word-card-content">
            <p class="word-label">Думата е...</p>
            <div class="word-display" id="wordDisplay">Готови ли сте?</div>
            <p class="word-translation" id="wordTranslation"></p>
            <p class="word-hint" id="wordHint"></p>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-panel">
      <div class="stats">
        <div>Думи остават: <span id="remaining">—</span></div>
        <div>Използвани: <span id="used">0</span></div>
      </div>

      <div class="controls">
        <button class="btn btn-start" id="btnStart">▶ СТАРТ</button>
        <button class="btn btn-next" id="btnNext" disabled>⏭ Следваща дума</button>
      </div>

      <p class="instructions">
        Един ученик седи на <strong>горещия стол</strong> и не вижда думата.
        Останалите му дават <strong>подсказки на английски</strong> — без да казват самата дума!
      </p>
    </div>
    </div>
  </div>

  <script>
    const WORDS = [
      // Emotions & feelings
      { word: "embarrassment",   translation: "смущение",           hint: "That red-face feeling when everyone is looking at you" },
      { word: "excitement",      translation: "вълнение",           hint: "How you feel before a trip, party, or big game" },
      { word: "disappointment", translation: "разочарование",      hint: "When something you hoped for doesn't happen" },
      { word: "frustration",     translation: "раздразнение",       hint: "When nothing works and you want to give up" },
      { word: "anxiety",         translation: "тревога",            hint: "Worry and nervousness before a test or presentation" },
      { word: "pride",           translation: "гордост",            hint: "How you feel when you did something really well" },
      { word: "relief",          translation: "облекчение",         hint: "That sigh when a scary moment is finally over" },
      { word: "boredom",         translation: "скука",              hint: "When the lesson feels endless and you stare at the clock" },
      { word: "homesickness",    translation: "носталгия по дома",  hint: "Missing your family and home when you're far away" },
      { word: "heartbreak",      translation: "разбито сърце",       hint: "Deep sadness when a relationship ends" },
      { word: "nostalgia",       translation: "носталгия",          hint: "A warm, sad feeling when you remember the past" },
      { word: "jealousy",        translation: "ревност",            hint: "When a friend gets something you really wanted" },
      { word: "loneliness",      translation: "самота",             hint: "Feeling alone even when people are around you" },
      { word: "optimism",        translation: "оптимизъм",          hint: "Always believing things will turn out fine" },
      { word: "pessimism",       translation: "песимизъм",          hint: "Always expecting the worst to happen" },

      // Friends & relationships
      { word: "friendship",      translation: "приятелство",        hint: "The bond between people who trust and support each other" },
      { word: "betrayal",        translation: "предателство",       hint: "When someone you trust lets you down badly" },
      { word: "loyalty",         translation: "лоялност",           hint: "Standing by your friends even in hard times" },
      { word: "gossip",          translation: "клюки",              hint: "Talking about other people's private lives" },

      { word: "apology",         translation: "извинение",          hint: "What you say when you know you were wrong" },

      // School life
      { word: "homework",        translation: "домашна работа",     hint: "Work your teacher gives you to do at home" },
      { word: "detention",       translation: "задържане след часове", hint: "Punishment — staying at school after classes end" },

      { word: "teamwork",        translation: "екипна работа",      hint: "Working together with classmates on a project" },
      { word: "competition",     translation: "състезание",         hint: "Trying to win against other students or teams" },
      { word: "procrastination", translation: "отлагане в последния момент", hint: "Leaving your homework until the very last minute" },

      // Family & home
      { word: "childhood",       translation: "детство",            hint: "The time when you were very young" },
      { word: "allowance",       translation: "джобни пари",        hint: "Money parents give you every week to spend" },
      { word: "curfew",          translation: "час за прибиране",   hint: "The latest time you must be home in the evening" },
      { word: "chores",          translation: "домашни задачи",     hint: "Jobs at home like cleaning, cooking, or washing dishes" },

      { word: "privacy",         translation: "лично пространство", hint: "Having your own space that others don't enter" },
      { word: "family dinner",   translation: "семейна вечеря",     hint: "When everyone sits together to eat in the evening" },
      { word: "sibling rivalry", translation: "съперничество между брат и сестра", hint: "Competing with your brother or sister for attention" },

      { word: "hometown",        translation: "роден град",         hint: "The town or city where you grew up" },

      // Hobbies, fun & free time

      { word: "camping",         translation: "кемпинг",            hint: "Sleeping outdoors in a tent under the stars" },
      { word: "concert",         translation: "концерт",            hint: "A live music show with hundreds of fans" },

      { word: "road trip",       translation: "пътешествие с кола", hint: "A long journey by car with friends or family" },
      { word: "sleepover",       translation: "нощувка у приятел",  hint: "Spending the night at a friend's house" },
      { word: "talent show",     translation: "талант шоу",         hint: "An event where students perform on stage" },
      { word: "bucket list",     translation: "списък с мечти",     hint: "Things you dream of doing before you grow old" },
      { word: "hobby",           translation: "хоби",               hint: "Something you love doing in your free time" },
      { word: "collection",      translation: "колекция",           hint: "Many similar items you keep — stamps, cards, figures" },
      { word: "surprise party",  translation: "изненадващо парти",   hint: "A celebration the guest of honour knows nothing about" },

      // Personality & character
      { word: "honesty",         translation: "честност",           hint: "Always telling the truth, even when it's hard" },

      { word: "dream job",       translation: "работа-мечта",       hint: "The perfect career you imagine having as an adult" },

    const wordDisplay = document.getElementById('wordDisplay');
    const wordTranslation = document.getElementById('wordTranslation');
    const wordHint = document.getElementById('wordHint');
    const wordCard = document.getElementById('wordCard');
    const seatCenter = document.querySelector('.seat-center');
    const btnStart = document.getElementById('btnStart');
    const btnNext = document.getElementById('btnNext');
    const remainingEl = document.getElementById('remaining');
    const usedEl = document.getElementById('used');

    let pool = [];
    let usedCount = 0;
    let isShuffling = false;
    let currentEntry = null;

    function fitSeat() {
      if (!seatCenter || !wordCard) return;

      seatCenter.style.setProperty('--s', '1');

      requestAnimationFrame(() => {
        const style = getComputedStyle(wordCard);
        const padY = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
        const available = wordCard.clientHeight - padY;
        let needed = seatCenter.scrollHeight;

        if (needed > available && needed > 0) {
          seatCenter.style.setProperty('--s', String(available / needed));
          requestAnimationFrame(() => {
            needed = seatCenter.scrollHeight;
            if (needed > available) {
              seatCenter.style.setProperty('--s', String(available / needed));
            }
          });
        }
      });
    }

    function initPool() {
      pool = [...WORDS].sort(() => Math.random() - 0.5);
      usedCount = 0;
      updateStats();
    }

    function updateStats() {
      remainingEl.textContent = pool.length;
      usedEl.textContent = usedCount;
    }

    function createEmbers() {
      const container = document.getElementById('embers');
      for (let i = 0; i < 40; i++) {
        const ember = document.createElement('div');
        ember.className = 'ember';
        ember.style.left = Math.random() * 100 + '%';
        ember.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
        ember.style.animationDuration = (4 + Math.random() * 6) + 's';
        ember.style.animationDelay = (Math.random() * 8) + 's';
        ember.style.width = ember.style.height = (2 + Math.random() * 4) + 'px';
        container.appendChild(ember);
      }
    }

    function spawnBurst(x, y) {
      const colors = ['#ff4d00', '#ff8c00', '#ffd000', '#ff6020', '#fff'];
      for (let i = 0; i < 24; i++) {
        const p = document.createElement('div');
        p.className = 'burst';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.background = colors[i % colors.length];
        const angle = (Math.PI * 2 * i) / 24;
        const dist = 60 + Math.random() * 100;
        p.style.setProperty('--bx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--by', Math.sin(angle) * dist + 'px');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 900);
      }
    }

    function pickWord() {
      if (pool.length === 0) {
        pool = [...WORDS].sort(() => Math.random() - 0.5);
        usedCount = 0;
      }
      const entry = pool.pop();
      usedCount++;
      updateStats();
      return entry;
    }

    function shuffleAnimation(callback) {
      isShuffling = true;
      btnStart.disabled = true;
      btnNext.disabled = true;

      wordCard.classList.remove('revealed');
      wordCard.classList.add('shuffling');
      wordDisplay.classList.remove('revealed');
      wordDisplay.classList.add('shuffling');
      wordHint.classList.remove('visible');
      wordHint.textContent = '';
      wordTranslation.classList.remove('visible');
      wordTranslation.classList.add('shuffling');
      wordTranslation.textContent = '';

      fitSeat();

      const candidates = [...WORDS].sort(() => Math.random() - 0.5);
      let step = 0;
      const totalSteps = 28;
      const interval = setInterval(() => {
        const idx = step % candidates.length;
        wordDisplay.textContent = candidates[idx].word;
        wordTranslation.textContent = candidates[idx].translation;
        step++;

        if (step >= totalSteps) {
          clearInterval(interval);
          callback();
        }
      }, 70);
    }

    function revealWord(entry) {
      currentEntry = entry;
      wordDisplay.textContent = entry.word;
      wordTranslation.textContent = entry.translation;
      wordHint.textContent = '💡 ' + entry.hint;

      wordCard.classList.remove('shuffling');
      wordDisplay.classList.remove('shuffling');
      wordTranslation.classList.remove('shuffling');
      wordCard.classList.add('revealed');
      wordDisplay.classList.add('revealed');

      setTimeout(() => wordTranslation.classList.add('visible'), 200);
      setTimeout(() => {
        wordHint.classList.add('visible');
        fitSeat();
      }, 400);

      const rect = wordCard.getBoundingClientRect();
      spawnBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);

      isShuffling = false;
      btnStart.disabled = false;
      btnNext.disabled = false;
    }

    function startRound() {
      if (isShuffling) return;
      const entry = pickWord();
      shuffleAnimation(() => revealWord(entry));
    }

    btnStart.addEventListener('click', startRound);
    btnNext.addEventListener('click', startRound);

    initPool();
    createEmbers();
    remainingEl.textContent = WORDS.length;
    fitSeat();
    document.fonts.ready.then(fitSeat);
    window.addEventListener('resize', fitSeat);
  </script>
