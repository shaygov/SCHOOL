<body>
    <div class="page-header-print">
        <div class="ministry" id="print-ministry"></div>
        <div class="school" id="print-school"></div>
        <div class="contact" id="print-contact"></div>
    </div>
    <div class="container" id="container">
        <!-- Съдържанието ще се генерира динамично -->
    </div>
    <script>
        // Конфигурация - задайте варианта и пътя към JSON файла
        // Вариантът може да се зададе чрез URL параметър: ?variant=1 или ?variant=2
        const urlParams = new URLSearchParams(window.location.search);
        const CONFIG = {
            variant: parseInt(urlParams.get('variant')) || 1, // По подразбиране вариант 1
            dataFile: urlParams.get('data') || 'data.json' // Път към JSON файла
        };

        let testData = null;

        // Зареждане на данните от JSON
        async function loadData() {
            try {
                const response = await fetch(CONFIG.dataFile);
                testData = await response.json();
                generateTest();
            } catch (error) {
                console.error('Грешка при зареждане на данните:', error);
                document.getElementById('container').innerHTML = '<p style="color: red;">Грешка при зареждане на данните. Моля, проверете дали файлът data.json съществува.</p>';
            }
        }

        // Създаване на header HTML шаблон
        function createHeader() {
            const headerDiv = document.createElement('div');
            headerDiv.className = 'page-header-injected';
            const logo = testData.school.logo || 'logo.png';
            headerDiv.innerHTML = `
                <img src="${logo}" alt="Logo" class="header-logo" onerror="this.style.display='none'">
                <div class="header-content">
                    <div class="ministry">${testData.school.ministry}</div>
                    <div class="school">${testData.school.name}</div>
                    <div class="contact">${testData.school.contact}</div>
                </div>
                <img src="${logo}" alt="Logo" class="header-logo" onerror="this.style.display='none'">
            `;
            return headerDiv;
        }

        // Генериране на теста
        function generateTest() {
            const container = document.getElementById('container');
            const variant = testData.variants[CONFIG.variant - 1];
            const test = testData.test;

            // Обновяване на заглавието
            document.title = `Контролна работа - ${test.subject} ${test.class} - Вариант ${CONFIG.variant}`;

            // Попълване на page-header-print
            document.getElementById('print-ministry').textContent = testData.school.ministry;
            document.getElementById('print-school').textContent = testData.school.name;
            document.getElementById('print-contact').textContent = testData.school.contact;

            // Генериране на header секцията
            let html = `
                <div class="header">
                    <h1>КОНТРОЛНА РАБОТА <br/> ПО <br/> ${test.subject.toUpperCase()}</h1>
                    <p><strong>Клас:</strong> ${test.class} | <strong>Вариант ${CONFIG.variant}</strong></p>
                    <div class="header-bottom">
                        <div class="header-date">
                            <p><strong>${test.term}</strong></p>
                        </div>
                        <div class="header-approval">
                            <div class="approval-line"><strong>${test.approval.approvedBy}</strong>...................................</div>
                            <div class="approval-name">${test.approval.name}</div>
                            <div class="approval-title">${test.approval.title}</div>
                        </div>
                    </div>
                </div>

                <div class="student-info">
                    <table>
                        <tr>
                            <td style="width: 33.33%;"><strong>Име:</strong><br><div style="border-bottom: 1px solid #000; width: 100%; min-height: 20px;"></div></td>
                            <td style="width: 33.33%;"><strong>Фамилия:</strong><br><div style="border-bottom: 1px solid #000; width: 100%; min-height: 20px;"></div></td>
                            <td style="width: 33.33%;"><strong>Номер в клас:</strong><br><div style="border-bottom: 1px solid #000; width: 100%; min-height: 20px;"></div></td>
                        </tr>
                    </table>
                </div>
            `;

            // Генериране на въпросите
            if (variant.questions && variant.questions.length > 0) {
                variant.questions.forEach((q) => {
                    const points = q.points || test.points.perQuestion;
                    
                    // Проверяваме дали въпросът е с избираем отговор (multiple choice)
                    if (q.options && Array.isArray(q.options)) {
                        // Групиране на въпроси 1 и 2 на една страница
                        if (q.number === 1) {
                            html += `<div class="question-group-1-2">`;
                        }
                        
                        // Добавяме клас за предотвратяване на page break след въпрос 11
                        const questionClass = (q.number === 11) ? 'question no-break-after' : 'question';
                        html += `
                            <div class="${questionClass}">
                                <div class="question-number">${q.number}. ${q.question}</div>
                                <div class="points-display">(${points} точки)</div>
                                <div class="options">
                        `;
                        q.options.forEach((option) => {
                            html += `<div class="option">${option}</div>`;
                        });
                        html += `
                                </div>
                            </div>
                        `;
                        
                        // Затваряме групата след въпрос 2
                        if (q.number === 2) {
                            html += `</div>`;
                        }
                    } else {
                        // Обработка на отворени въпроси (open-ended questions)
                        const questionParts = q.question.split('\n\n');
                        const questionText = questionParts[0] || q.question;
                        const codeText = questionParts.slice(1).join('\n\n');
                        
                        // Започваме група за въпроси 12 и 13 на една страница ПРЕДИ да генерираме HTML за въпрос 12
                        if (q.number === 12) {
                            html += `<div class="question-group-12-13">`;
                        }
                        
                        // Затваряме групата след въпрос 13 (12 и 13 на една страница)
                        if (q.number === 13) {
                            html += `</div>`; // Затваряме question-group-12-13
                            // Започваме група за въпрос 14
                            html += `<div class="question-group-13-14">`;
                        }
                        
                        // Започваме вътрешна група за въпрос 14 (скалата ще е извън нея, но в question-group-13-14)
                        if (q.number === 14) {
                            html += `<div class="question-14-group">`;
                        }

                        html += `
                            <div class="open-question">
                                <div class="question-number">${q.number}. ${questionText}</div>
                                <div class="points-display">(${points} точки)</div>
                        `;
                        
                        // Обработка на допълнителния блок (SQL с празни места или HTML схема)
                        if (codeText) {
                            if (codeText.includes('<table')) {
                                html += `
                                    <div style="margin-top: 10px; margin-bottom: 10px;">
                                        ${codeText}
                                    </div>
                                `;
                            } else if (codeText.includes('_________')) {
                                let escapedCode = codeText
                                    .replace(/&/g, '&amp;')
                                    .replace(/</g, '&lt;')
                                    .replace(/>/g, '&gt;');
                                
                                const codeWithBlanks = escapedCode.replace(/_{10,}/g, (match) => {
                                    const length = match.length;
                                    return '<span class="code-blank" style="border-bottom: 2px solid #000; display: inline-block; min-width: ' + (Math.max(length * 8, 120)) + 'px; text-align: left; padding: 0 8px; font-weight: bold; margin: 0 2px; line-height: 1;">' + '&nbsp;'.repeat(Math.max(length - 5, 5)) + '</span>';
                                });
                                
                                html += `
                                    <div class="code-block" style="margin-top: 10px;">
                                        <pre style="margin: 0; padding: 12px; background-color: #f5f5f5; border: 1px solid #999; font-family: 'Courier New', monospace; font-size: 10pt; white-space: pre-wrap; word-wrap: break-word; line-height: 1.5;">${codeWithBlanks}</pre>
                                    </div>
                                `;
                            }
                        } else if (q.question.includes('_________')) {
                            let escapedCode = q.question
                                .replace(/&/g, '&amp;')
                                .replace(/</g, '&lt;')
                                .replace(/>/g, '&gt;');
                            
                            const codeWithBlanks = escapedCode.replace(/_{10,}/g, (match) => {
                                const length = match.length;
                                return '<span class="code-blank" style="border-bottom: 2px solid #000; display: inline-block; min-width: ' + (Math.max(length * 8, 120)) + 'px; text-align: left; padding: 0 8px; font-weight: bold; margin: 0 2px; line-height: 1;">' + '&nbsp;'.repeat(Math.max(length - 5, 5)) + '</span>';
                            });
                            
                            html += `
                                <div class="code-block" style="margin-top: 10px;">
                                    <pre style="margin: 0; padding: 12px; background-color: #f5f5f5; border: 1px solid #999; font-family: 'Courier New', monospace; font-size: 10pt; white-space: pre-wrap; word-wrap: break-word; line-height: 1.5;">${codeWithBlanks}</pre>
                                </div>
                            `;
                        }
                        
                        // Добавяме поле за отговор на отворените въпроси
                        // За въпроси 13 и 14 използваме compact клас за по-малка височина
                        const answerClass = (q.number === 13 || q.number === 14) ? 'answer-space compact' : 'answer-space';
                        
                        html += `
                                <div class="${answerClass}"></div>
                            </div>
                        `;
                        
                        // Затваряме групите след въпрос 14
                        if (q.number === 14) {
                            html += `</div>`; // Затваряме question-14-group (вътрешната)
                            html += `</div>`; // Затваряме question-group-13-14 (въпроси 13 и 14)
                            // Скалата ще е на отделна страница
                        }
                    }
                });
            } else {
                // Fallback за старата структура (multipleChoice и openEnded)
                if (variant.multipleChoice) {
                    variant.multipleChoice.forEach((q, index) => {
                        html += `
                            <div class="question">
                                <div class="question-number">${q.number}. ${q.question}</div>
                                <div class="points-display">(${test.points.multipleChoice} точки)</div>
                                <div class="options">
                        `;
                        const labels = ['а', 'б', 'в', 'г'];
                        q.options.forEach((option, optIndex) => {
                            html += `<div class="option">${labels[optIndex]}) ${option}</div>`;
                        });
                        html += `
                                </div>
                            </div>
                        `;
                    });
                }
                
                if (variant.openEnded) {
                    html += '<div class="question-group-15-16">';
                    variant.openEnded.forEach((q) => {
                        const points = q.points || test.points.openEnded;
                        const isCompact = q.number === 15 || q.number === 16;
                        
                        if (q.number === 17) {
                            return;
                        }
                        
                        const questionClass = isCompact ? 'open-question compact' : 'open-question';
                        const answerClass = isCompact ? 'answer-space compact' : 'answer-space';
                        
                        html += `
                            <div class="${questionClass}">
                                <div class="question-number">${q.number}. ${q.question}</div>
                                <div class="points-display">(${points} точки)</div>
                        `;
                        if (q.codeExample) {
                            let escapedCode = q.codeExample
                                .replace(/&/g, '&amp;')
                                .replace(/</g, '&lt;')
                                .replace(/>/g, '&gt;');
                            
                            const codeWithBlanks = escapedCode.replace(/_{4,}/g, (match) => {
                                const length = match.length;
                                return '<span class="code-blank" style="border-bottom: 2px solid #000; display: inline-block; min-width: ' + (Math.max(length * 8, 120)) + 'px; text-align: left; padding: 0 8px; font-weight: bold; margin: 0 2px; line-height: 1;">' + '&nbsp;'.repeat(length) + '</span>';
                            });
                            
                            html += `
                                <div class="code-block" style="margin-top: 10px; ">
                                    <pre style="margin: 0; padding: 12px; background-color: #f5f5f5; border: 1px solid #999; font-family: 'Courier New', monospace; font-size: 10pt; white-space: pre-wrap; word-wrap: break-word; line-height: 1.5;">${codeWithBlanks}</pre>
                                </div>
                            `;
                        }
                        if (!q.codeExample && q.requirements && q.requirements.length > 0) {
                            html += '<ul>';
                            q.requirements.forEach(req => {
                                html += `<li>${req}</li>`;
                            });
                            html += '</ul>';
                        }
                        if (!q.codeExample) {
                            html += `
                                <div class="${answerClass}"></div>
                            `;
                        }
                        html += `
                            </div>
                        `;
                    });
                    html += '</div>';
                    
                    const question17 = variant.openEnded.find(q => q.number === 17);
                    if (question17) {
                        const points = question17.points || test.points.openEnded;
                        html += `
                            <div class="open-question compact">
                                <div class="question-number">${question17.number}. ${question17.question}</div>
                                <div class="points-display">(${points} точки)</div>
                        `;
                        if (question17.requirements && question17.requirements.length > 0) {
                            html += '<ul>';
                            question17.requirements.forEach(req => {
                                html += `<li>${req}</li>`;
                            });
                            html += '</ul>';
                        }
                        html += `
                                <div class="answer-space compact"></div>
                            </div>
                        `;
                    }
                }
            }
            
            // Групиране на скалата за оценяване - винаги на отделна страница
            html += '<div class="question-17-group">';
            html += `<div class="page-break-before"></div>`;
            
            // Генериране на скалата за оценяване
            html += `
                <div class="grading-scale">
                    <table>
                        <thead>
                            <tr>
                                <th colspan="2">Скала за превръщане на точките в оценка:</th>
                            </tr>
                            <tr>
                                <th>точки</th>
                                <th>оценка</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            test.gradingScale.forEach(scale => {
                html += `
                    <tr>
                        <td>от ${scale.from} до ${scale.to}т.</td>
                        <td>${scale.grade}</td>
                    </tr>
                `;
            });
            html += `
                        </tbody>
                    </table>
                </div>

                <div class="grading-fields">
                    <div class="field">
                        <span class="field-label">Общо точки:</span>
                        <span class="field-line"></span>
                    </div>
                    <div class="field">
                        <span class="field-label">Оценка:</span>
                        <span class="field-line"></span>
                    </div>
                    <div class="field">
                        <span class="field-label">Преподавател:</span>
                        <span class="field-line"></span>
                    </div>
                    <div class="field">
                        <span class="field-label">Ученик:</span>
                        <span class="field-line"></span>
                    </div>
                </div>
            `;
            
            // Затваряме групата след скалата
            html += `</div>`; // Затваряме question-17-group

            container.innerHTML = html;

            // Добавяме само един header в началото (само на първата страница)
            if (container.firstChild) {
                const headerDiv = createHeader();
                container.insertBefore(headerDiv, container.firstChild);
            }
        }

        // Изпълняваме при зареждане на страницата
        window.addEventListener('load', loadData);
    </script>
</body>
</html>
